<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

</head>


<body style="
    margin:0;
    padding-top:100px;
    min-height:100vh;
    background:#eef2f7;
    font-family:'Segoe UI', sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
">


<!-- Navbar -->

<nav style="
    width:100%;
    height:70px;
    background:linear-gradient(135deg,#0d6efd,#6610f2);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    position:fixed;
    top:0;
    left:0;
    box-sizing:border-box;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    z-index:1000;
">


    <div style="
        color:white;
        font-size:24px;
        font-weight:700;
        letter-spacing:1px;
    ">
        🎓 Student Management System
    </div>


    <div>

        <a th:href="@{/students}"
        style="
            text-decoration:none;
            color:white;
            font-size:15px;
            font-weight:400;
            padding:8px 20px;
            border-radius:25px;
            
        ">
             Student Management 
        </a>

    </div>


</nav>



<!-- Registration Card -->

<div style="
    width:450px;
    background:white;
    padding:40px;
    margin-top:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
">



    <!-- Icon -->

    <div style="
        width:70px;
        height:70px;
        margin:0 auto 20px;
        display:flex;
        justify-content:center;
        align-items:center;
        border-radius:50%;
        background:linear-gradient(135deg,#2563eb,#7c3aed);
        color:white;
        font-size:32px;
    ">
        🎓
    </div>



    <h1 style="
        text-align:center;
        color:#1e293b;
        margin-bottom:35px;
        font-size:30px;
    ">
       Update Student 
    </h1>




<form th:action="@{/students/edit/{id}(id=${student.id})}" 
      th:object="${student}" 
      method="post">



    <div style="
        margin-bottom:22px;
    ">

        <label style="
            display:block;
            color:#475569;
            font-weight:600;
            margin-bottom:8px;
        ">
            First Name
        </label>


        <input type="text"
        name="firstName" th:field="*{firstName}"
        placeholder="Enter your first name"

        style="
            width:100%;
            padding:14px 16px;
            border:2px solid #e2e8f0;
            border-radius:12px;
            font-size:16px;
            color:#334155;
            outline:none;
        ">

    </div>





    <div style="
        margin-bottom:22px;
    ">

        <label style="
            display:block;
            color:#475569;
            font-weight:600;
            margin-bottom:8px;
        ">
            Last Name
        </label>


        <input type="text"
        name="lastName"  th:field="*{lastName}"
        placeholder="Enter your last name"

        style="
            width:100%;
            padding:14px 16px;
            border:2px solid #e2e8f0;
            border-radius:12px;
            font-size:16px;
            color:#334155;
            outline:none;
        ">

    </div>






    <div style="
        margin-bottom:22px;
    ">

        <label style="
            display:block;
            color:#475569;
            font-weight:600;
            margin-bottom:8px;
        ">
            Email
        </label>


        <input type="email"
        name="email"  th:field="*{email}"
        placeholder="Enter your email address"

        style="
            width:100%;
            padding:14px 16px;
            border:2px solid #e2e8f0;
            border-radius:12px;
            font-size:16px;
            color:#334155;
            outline:none;
        ">

    </div>





    <button type="submit"

    style="
        width:100%;
        padding:15px;
        border:none;
        border-radius:12px;
        background:linear-gradient(135deg,#2563eb,#4f46e5);
        color:white;
        font-size:17px;
        font-weight:600;
        cursor:pointer;
    ">

        Submit

    </button>



</form>


</div>


</body>

</html>
